<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04100a" />
  <title>Geolympics — Prisijungimas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <!-- ══════════════════════════════════════════
       SCREEN 1: LOGIN
  ══════════════════════════════════════════ -->
  <div id="login-screen" class="page">
 
    <div class="logo">
      <span class="logo-icon">🧭</span>
      <h1>GEOLYMPICS</h1>
      <p class="tagline">Geocaching varžybos · 2026</p>
    </div>
 
    <div class="card" style="animation-delay:0.15s">
      <div class="card-title">⛳ Prisijungimas</div>
 
      <label for="nickname-input">Jūsų geocaching slapyvardis</label>
      <input
        type="text"
        id="nickname-input"
        placeholder="pvz. NightWalker99"
        maxlength="20"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
 
      <button class="btn btn-primary" id="login-btn">Prisijungti →</button>
      <p class="error-msg" id="login-error"></p>
    </div>
 
    <p class="footer">Geolympics · Klaipėda 2026</p>
  </div>
 
  <!-- ══════════════════════════════════════════
       SCREEN 2: WAITING ROOM
  ══════════════════════════════════════════ -->
  <div id="waiting-screen" class="page hidden">
 
    <div class="waiting-content">
      <!-- Animated compass ring -->
      <div class="pulse-ring">
        <span class="compass-emoji">🧭</span>
      </div>
 
      <h2>Greitai prasidės!</h2>
      <p>Laukite organizatorių signalo...</p>
 
      <div class="player-badge">
        👤 Sveiki, <strong id="waiting-nickname">—</strong>
      </div>
 
      <div style="margin-top:32px; color: var(--text-muted); font-size:13px; animation: blink 2s ease-in-out infinite;">
        ⏳ Laukiama starto signalo...
      </div>
    </div>
 
    <p class="footer">Geolympics · Klaipėda 2026</p>
  </div>
 
  <!-- ══════════════════════════════════════════
       FIREBASE SDK (v8 compat — veikia GitHub Pages)
  ══════════════════════════════════════════ -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
 
  <!-- Jūsų Firebase konfigūracija -->
  <script src="firebase-config.js"></script>
 
  <!-- ══════════════════════════════════════════
       PUSLAPIO LOGIKA
  ══════════════════════════════════════════ -->
  <script>
  (function () {
    'use strict';
 
    // ── Ekranai ──────────────────────────────────────────────
    const loginScreen   = document.getElementById('login-screen');
    const waitingScreen = document.getElementById('waiting-screen');
    const loginBtn      = document.getElementById('login-btn');
    const nicknameInput = document.getElementById('nickname-input');
    const loginError    = document.getElementById('login-error');
    const waitingNick   = document.getElementById('waiting-nickname');
 
    // Jei žaidėjas jau prisijungęs ir žaidimas pradėtas — siųsti į žaidimą
    const savedNick = localStorage.getItem('geolympics_nick');
    if (savedNick) {
      db.ref('game/started').once('value').then(snap => {
        if (snap.val() === true) {
          window.location.href = 'game.html';
        } else {
          // Pereiti į laukimo ekraną
          showWaiting(savedNick);
        }
      });
    }
 
    // ── Prisijungimo mygtukas ─────────────────────────────────
    loginBtn.addEventListener('click', handleLogin);
    nicknameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
 
    function handleLogin() {
      const nick = nicknameInput.value.trim();
 
      // Validacija
      if (!nick) {
        showError('Įveskite slapyvardį!');
        return;
      }
      if (nick.length < 2) {
        showError('Slapyvardis per trumpas (min. 2 simboliai).');
        return;
      }
      if (!/^[a-zA-Z0-9ąčęėįšųūžĄČĘĖĮŠŲŪŽ _-]+$/.test(nick)) {
        showError('Slapyvardyje naudokite tik raides, skaičius ir _-');
        return;
      }
 
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span>Jungiamasi...';
      clearError();
 
      // Patikrinti ar slapyvardis užimtas
      const playerRef = db.ref('players/' + safeKey(nick));
 
      playerRef.once('value').then(snap => {
        if (snap.exists()) {
          showError('Šis slapyvardis jau naudojamas! Pasirinkite kitą.');
          loginBtn.disabled = false;
          loginBtn.innerHTML = 'Prisijungti →';
          return;
        }
 
        // Įrašyti žaidėją į Firebase
        return playerRef.set({
          nickname:        nick,
          currentWaypoint: 1,
          startTime:       null,
          finishTime:      null,
          joinedAt:        firebase.database.ServerValue.TIMESTAMP
        });
      })
      .then(() => {
        // Išsaugoti slapyvardį naršyklėje
        localStorage.setItem('geolympics_nick', nick);
        localStorage.setItem('geolympics_key',  safeKey(nick));
        showWaiting(nick);
      })
      .catch(err => {
        console.error(err);
        showError('Klaida. Patikrinkite interneto ryšį.');
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Prisijungti →';
      });
    }
 
    // ── Laukimo ekranas ───────────────────────────────────────
    function showWaiting(nick) {
      loginScreen.classList.add('hidden');
      waitingScreen.classList.remove('hidden');
      waitingNick.textContent = nick;
 
      // Klausyti Firebase: kai gameStarted = true → eiti į žaidimą
      db.ref('game/started').on('value', snap => {
        if (snap.val() === true) {
          window.location.href = 'game.html';
        }
      });
    }
 
    // ── Pagalbinės funkcijos ──────────────────────────────────
    function showError(msg) {
      loginError.textContent = msg;
    }
 
    function clearError() {
      loginError.textContent = '';
    }
 
    // Firebase raktai negali turėti . # $ [ ] /
    function safeKey(nick) {
      return nick.replace(/[.#$\[\]/]/g, '_');
    }
 
  })();
  </script>
 
</body>
</html>
